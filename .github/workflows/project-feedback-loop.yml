name: Project feedback loop

on:
  push:
    paths:
      - "project-feedback-loop/**"
      - ".github/workflows/project-feedback-loop.yml"
  pull_request:
    paths:
      - "project-feedback-loop/**"
      - ".github/workflows/project-feedback-loop.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: project-feedback-loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run reference kit tests
        run: python -m unittest discover -s tests -v
      - name: Compile kit scripts
        run: python -m compileall -q kit
      - name: Run example refresh
        run: python kit/refresh.py examples/minimal
      - name: Run portfolio example
        run: python kit/portfolio.py examples/portfolio/team-alpha examples/portfolio/team-beta --output portfolio-generated
      - name: Verify portfolio projection
        run: >-
          python -c "import json; d=json.load(open('portfolio-generated/portfolio.json'));
          assert d['workspaces'] == ['team-alpha', 'team-beta'];
          assert [item['id'] for item in d['items']] == ['ALPHA-001', 'CT-2026-015'];
          assert all(item['workspace_observed_at'] != 'unknown' for item in d['items'])"

  windows-wrapper:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project-feedback-loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run PowerShell refresh wrapper
        shell: pwsh
        run: .\schedulers\windows-task-scheduler\refresh.ps1 -RepositoryRoot $PWD -Python python
      - name: Check generated context
        shell: pwsh
        run: if (-not (Test-Path .\examples\minimal\generated\context.html)) { throw "context.html was not generated" }
