name: Project feedback loop

on:
  push:
    paths:
      - "project-feedback-loop/**"
      - ".github/workflows/project-feedback-loop.yml"
  pull_request:
    paths:
      - "project-feedback-loop/**"
      - ".github/workflows/project-feedback-loop.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: project-feedback-loop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run reference kit tests
        run: python -m unittest discover -s tests -v
      - name: Run example refresh
        run: python kit/refresh.py examples/minimal
